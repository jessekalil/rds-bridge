targets:
  # A target is one RDS instance (one SSM tunnel) exposed on one local port.
  # The client picks which database to connect to (via dbname / DB_DATABASE),
  # so a single port serves every database on the instance.
  my-rds-dev:
    aws_region: us-east-1

    ssm:
      profile: my-ssm-profile
      target: i-xxxxxxxxxxxxxxxxx
      remote_host: my-db.internal.example.com
      remote_port: 5432
      local_port: 5433

    iam:
      profile: my-iam-profile
      token_host: my-db.cluster-xxxxxxxxxxxx.us-east-1.rds.amazonaws.com
      token_port: 5432
      # user: optional override; defaults to STS GetCallerIdentity UserId

    # Local port the app connects to, and the static credential it uses to reach
    # the proxy (the real RDS auth uses a per-connection IAM token).
    listen_port: 5488
    local:
      user: app
      password: app
